<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kneuklid Romance | Beyond the Rainbow</title>
  <style>
    html,body{margin:0;height:100%;background:#f4f6f8}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>

<iframe id="app" src="./app-base.html?v=15"></iframe>

<script>
const f = document.getElementById('app');

f.addEventListener('load', () => {
  try {
    const d = f.contentDocument;

    const patch = d.createElement('script');
    patch.src = './app-patch.js?v=15';

    patch.onload = () => {
      const v14 = d.createElement('script');
      v14.src = './v14.js?v=15';

      v14.onload = () => {
        [
          './firebase-login-ui.js?v=15',
          './firebase-loader.js?v=15',
          './firebase-auth.js?v=15',
          './firebase-data.js?v=15'
        ].forEach(src => {
          const s = d.createElement('script');
          s.src = src;
          d.body.appendChild(s);
        });
      };

      d.body.appendChild(v14);
    };

    d.body.appendChild(patch);

  } catch(e) {
    console.error(e);
  }
});
</script>

</body>
</html>
