<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kneuklid Romance | Beyond the Rainbow</title>
  <style>
    html,body{margin:0;height:100%;background:#f4f6f8}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=21"></iframe>
<script>
const f=document.getElementById('app');
function addScript(d,src){return new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
f.addEventListener('load',async()=>{
  try{
    const d=f.contentDocument;
    await addScript(d,'./app-patch.js?v=21');
    await addScript(d,'./v14.js?v=21');
    await addScript(d,'./firebase-login-ui.js?v=21');
    await addScript(d,'./firebase-auth.js?v=21');
    await addScript(d,'./firebase-data.js?v=21');
    await addScript(d,'./member-login.js?v=21');
    await addScript(d,'./board-badge.js?v=21');
    await addScript(d,'./auth-gate.js?v=21');
    await addScript(d,'./firebase-loader.js?v=21');
  }catch(e){console.error('App bootstrap failed',e)}
});
</script>
</body>
</html>
