【Kneuklid Romance LIVE 議事録】

■ ライブタイトル
Beyond the Rainbow

虹を越えた「その先」へ進む。
解散を終着点にせず、前回の「Rainbow」のその先へ進んでいく、現在進行形の活動という意味を込める。

■ 会場・開催日
・赤羽ReNY alphaを候補
・金曜日が取れるか、TAKUYAが確認

■ チケット
・チケット販売方法については会場と相談
・手数料のかからないチケットサイトが使用可能か確認

■ VIPチケット
【特典候補】
・公開リハ
・アフターパーティー
・最前列確保
・VIPグッズ

【確認事項】
・各特典が会場で実施可能か確認
・追加料金の有無を確認
・VIPチケットの売上を全額こちらで受け取れるか確認
・TAKUYAからReNYへ確認・交渉

■ ドラム
・かえでくん

■ 楽曲
・全アルバムから、まんべんなく選曲する方向

■ リハーサル
・ライブ直近の期間で月2回程度を予定
・料金を考慮して昼帯で実施
・13:00以降開始
・17:00まで
・早めに日程を決めれば、ばっさんも調整可能
・リハーサルスタジオは新宿

■ グッズ
・Tシャツ、タオルを受注生産で制作する方向

■ 公式LINE・告知
・TAKUYAがKneuklid Romance公式LINEを作成
・簡易HPは作らない
・公式Xから「公式LINEを作成した」旨を告知
・まず公式LINEを作り、ファンの反応を見る

■ デザイン・素材
・Kenichiがアイコンを制作
・必要素材を今週中に制作し、TAKUYAへ送る
・全体のデザイン担当：Kenichi

■ アーティスト写真
・新規撮影はしない方向で検討
・各自、自撮り写真をKenichiへ送る案などで検討

■ 担当

・デザイン：Kenichi
・運営：TAKUYA

=b.dataset.v))});function tc(t){return `<div class="card" onclick="taskModal('${t.id}')"><h3>${E(t.title)}</h3><span class="chip owner">${E(t.owner)}</span><span class="chip">${E(t.status)}</span><div class="desc">${E(t.desc)}</div></div>`}function renderTasks(){let q=$('q').value.toLowerCase(),o=$('of').value,s=$('sf').value,a=tasks.filter(t=>(!q||(t.title+' '+t.desc).toLowerCase().includes(q))&&(!o||t.owner===o)&&(!s||t.status===s));$('taskGrid').innerHTML=a.map(tc).join('');$('dashTasks').innerHTML=tasks.filter(t=>t.status!=='完了').map(tc).join('');$('completedGrid').innerHTML=tasks.filter(t=>t.status==='完了').map(tc).join('')||'<div class="muted">まだありません</div>';let d=tasks.filter(t=>t.status==='完了').length;$('done').textContent=d;$('open').textContent=tasks.length-d;$('wait').textContent=tasks.filter(t=>t.status==='確認待ち').length;$('pct').textContent=(tasks.length?Math.round(d/tasks.length*100):0)+'%'}function M(h){$('modal').innerHTML=`<div class="modal"><div class="dialog">${h}</div></div>`}function closeM(){$('modal').innerHTML=''}function taskModal(id=''){let t=tasks.find(x=>x.id===id)||{};M(`<h2>タスク</h2><div class="field"><label>タスク名</label><input id="mt" value="${E(t.title)}"></div><div class="field"><label>担当</label><select id="mo">${['TAKUYA','Kenichi','Yutaka','ばっさん','かえで','各メンバー'].map(x=>`<option ${x===t.owner?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>状態</label><select id="ms">${['未着手','進行中','確認待ち','完了','保留'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>メモ</label><textarea id="md">${E(t.desc)}</textarea></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="saveTask('${id}')">保存</button></div>`)}function saveTask(id){let o={id:id||Date.now()+'',title:$('mt').value,owner:$('mo').value,status:$('ms').value,desc:$('md').value};tasks=id?tasks.map(x=>x.id===id?o:x):[o,...tasks];save();closeM();renderTasks()}function scheduleModal(){M(`<h2>予定追加</h2><div class="field"><label>日付</label><input id="sd" type="date"></div><div class="field"><label>時間</label><input id="st" type="time"></div><div class="field"><label>内容</label><input id="sx"></div><div class="field"><label>場所</label><input id="sp"></div><div class="field"><label>担当</label><input id="so"></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="saveSchedule()">保存</button></div>`)}function saveSchedule(){schedules.push({id:Date.now()+'',date:$('sd').value,time:$('st').value,title:$('sx').value,place:$('sp').value,owner:$('so').value});save();closeM();renderSchedule()}function renderSchedule(){schedules.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('scheduleList').innerHTML=schedules.map(x=>`<div class="card event"><b>${E(x.date)} ${E(x.time)}</b><h3>${E(x.title)}</h3><div class="small">${E(x.place)} ${E(x.owner)}</div></div>`).join('')||'<div class="muted">予定はまだありません</div>'}function songModal(){M(`<h2>曲追加</h2><div class="field"><label>曲名</label><input id="ct"></div><div class="field"><label>出典</label><input id="cs"></div><div class="field"><label>同期</label><select id="cy"><option>なし</option><option>あり</option></select></div><div class="field"><label>準備</label><select id="cr"><option>未だ</option><option>準備完了</option></select></div><div class="field"><label>メモ</label><input id="cn"></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="saveSong()">保存</button></div>`)}function saveSong(){songs.push({title:$('ct').value,source:$('cs').value,sync:$('cy').value,ready:$('cr').value,note:$('cn').value});save();closeM();renderSongs()}function renderSongs(){$('songList').innerHTML=songs.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.title)}</td><td>${E(x.source)}</td><td>${E(x.sync)}</td><td>${E(x.ready)}</td><td>${E(x.note)}</td></tr>`).join('')||'<tr><td colspan="6">まだありません</td></tr>'}function artifactModal(){M(`<h2>成果物</h2><div class="field"><label>名称</label><input id="at"></div><div class="field"><label>担当</label><input id="ao"></div><div class="field"><label>保存先URL</label><input id="au"></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="saveArt()">保存</button></div>`)}function saveArt(){arts.unshift({title:$('at').value,owner:$('ao').value,url:$('au').value});save();closeM();renderArts()}function renderArts(){$('artifactList').innerHTML=arts.map(x=>`<div class="card"><h3>${E(x.title)}</h3><div>${E(x.owner)}</div>${x.url?`<a href="${E(x.url)}" target="_blank">保存先を開く</a>`:''}</div>`).join('')||'<div class="muted">まだありません</div>'}function boardModal(){M(`<h2>伝言板に書き込む</h2><div class="field"><label>名前</label><select id="ba"><option>TAKUYA</option><option>Kenichi</option><option>Yutaka</option><option>ばっさん</option><option>かえで</option><option>その他メンバー</option></select></div><div class="field"><label>タイトル</label><input id="bt"></div><div class="field"><label>内容</label><textarea id="bb"></textarea></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="savePost()">投稿</button></div>`)}function savePost(){posts.unshift({author:$('ba').value,title:$('bt').value,body:$('bb').value,date:new Date().toLocaleString('ja-JP')});save();closeM();renderPosts()}function renderPosts(){$('boardList').innerHTML=posts.map(x=>`<div class="card post"><b>${E(x.author)}</b><span class="small"> ${E(x.date)}</span><h3>${E(x.title)}</h3><div class="desc">${E(x.body).replace(/\n/g,'<br>')}</div></div>`).join('')||'<div class="muted">書き込みはまだありません</div>'}function minuteModal(){M(`<h2>議事録追加</h2><div class="field"><label>タイトル</label><input id="nt"></div><div class="field"><label>内容</label><textarea id="nb"></textarea></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="saveMin()">保存</button></div>`)}function saveMin(){mins.unshift({id:Date.now()+'',date:new Date().toISOString().slice(0,10),title:$('nt').value,body:$('nb').value});save();closeM();renderMins()}function renderMins(){$('minuteList').innerHTML=mins.map(x=>`<div class="card" style="margin-bottom:14px"><div class="small">${E(x.date)}</div><h3>${E(x.title)}</h3><div class="minute">${E(x.body)}</div></div>`).join('')} $('q').oninput=renderTasks;$('of').onchange=renderTasks;$('sf').onchange=renderTasks;renderTasks();renderSchedule();renderSongs();renderArts();renderPosts();renderMins();</script></body></html>
